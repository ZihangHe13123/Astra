[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "agent-lab-local"
version = "0.2.0"
description = "A personal AI agent for everyday tasks, powered by model APIs, with computer use, memory, and a terminal interface"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Zhi Hang", email = "149870896+ZihangHe13123@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "markdownify>=0.13",
  "openai>=1.50",
  "Pillow>=11.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "requests>=2.31",
  "tzdata; sys_platform == 'win32'",
  "websockets>=14,<16",
]

[project.urls]
Homepage = "https://github.com/ZihangHe13123/Astra"
Repository = "https://github.com/ZihangHe13123/Astra"
Issues = "https://github.com/ZihangHe13123/Astra/issues"
Documentation = "https://github.com/ZihangHe13123/Astra/blob/main/docs/README.md"

[project.optional-dependencies]
notebook = ["nbclient>=0.10,<1", "nbformat>=5.10,<6", "ipykernel>=6,<8"]
hindsight = ["hindsight-client==0.6.1"]
mcp = ["mcp>=1.27,<2"]
server = ["starlette>=0.27", "uvicorn>=0.29"]
tracing = [
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
]
legacy-tui = ["rich>=13", "textual>=0.80"]
embedding = ["mlx-embeddings>=0.1,<0.2; sys_platform == 'darwin'", "numpy>=1.26"]
dev = ["pytest==9.1.1", "ruff==0.16.4", "pyright==1.1.411", "pypdf>=5", "numpy>=1.26", "pydantic>=2,<3"]

[project.scripts]
agent-lab = "agent.cli.main:main"
agent-lab-backend = "agent.launcher.cli:backend"
agent-lab-eval = "agent.evals.replay:main"
astra = "agent.launcher.cli:main"

[tool.hatch.build.targets.sdist]
# Do not rely on VCS discovery: builds also run inside ignored worktrees and
# unpacked source archives. Only source inputs and explicit bundled skills ship.
ignore-vcs = true
only-include = [
  ".astra/skills/development/brainstorming/SKILL.md",
  ".astra/skills/development/dispatching-parallel-agents/SKILL.md",
  ".astra/skills/development/executing-plans/SKILL.md",
  ".astra/skills/development/finishing-a-development-branch/SKILL.md",
  ".astra/skills/development/receiving-code-review/SKILL.md",
  ".astra/skills/development/requesting-code-review/SKILL.md",
  ".astra/skills/development/subagent-driven-development/SKILL.md",
  ".astra/skills/development/systematic-debugging/SKILL.md",
  ".astra/skills/development/team-tdd-development/SKILL.md",
  ".astra/skills/development/test-driven-development/SKILL.md",
  ".astra/skills/development/using-git-worktrees/SKILL.md",
  ".astra/skills/development/verification-before-completion/SKILL.md",
  ".astra/skills/development/writing-plans/SKILL.md",
  ".astra/skills/operations/163-email-sync/SKILL.md",
  ".astra/skills/operations/activity-history/SKILL.md",
  ".astra/skills/operations/hermes-memory-sync/SKILL.md",
  ".astra/skills/operations/using-computer-use/SKILL.md",
  ".astra/skills/operations/using-computer-use/references/native-file-workflows.md",
  ".astra/skills/operations/visible-browser-cdp/SKILL.md",
  ".astra/skills/operations/wechat-mac-automation/SKILL.md",
  ".dockerignore",
  ".env.example",
  ".gitattributes",
  ".github",
  ".gitignore",
  "LICENSE",
  "README.md",
  "README.zh-CN.md",
  "agent",
  "astra.bat",
  "astra.py",
  "astra.sh",
  "browser-control-extension",
  "browser-extension",
  "config/channels.example.json",
  "config/filesystem.example.json",
  "config/macos_computer_compatibility.json",
  "config/mcp.example.json",
  "config/models.yaml",
  "docker",
  "docs",
  "evals",
  "native",
  "pyproject.toml",
  "requirements.txt",
  "scripts",
  "specs",
  "tests",
  "ui-core",
  "ui-gui",
  "ui-tui",
  "uv.lock",
]
exclude = [
  "**/.git", "**/.hg", "**/.venv", "**/.venv-wsl", "**/.logs",
  "**/.tmp", "**/.worktrees", "**/.pytest_cache", "**/.ruff_cache", "**/.mypy_cache",
  "**/.cache", "**/.vite", "**/output", "**/test-results", "**/playwright-report",
  "**/node_modules", "**/__pycache__", "**/*.py[cdo]",
  "**/*.tsbuildinfo", "**/.DS_Store",
  "/native/**/.build", "/native/**/.swiftpm", "/ui-core/dist", "/ui-gui/dist", "/ui-tui/dist",
  "/docs/superpowers", "/docs/validation", "/evals/coding/results",
  "/ui-tui/assets/lyra/v2", "/ui-tui/assets/lyra/v3", "/ui-tui/assets/lyra/v5",
  "/ui-tui/assets/lyra/v4-draft/avatar-draft.png", "/ui-tui/assets/lyra/v4-draft/sizes.png",
  "/ui-tui/src/assets/lyra-v2.json", "/ui-tui/src/assets/lyra-v5.json",
  "**/.env", "**/.env.*", "!**/.env.example", "**/persona.local.json",
  "**/*.pem", "**/*.p12", "**/*.pfx", "**/*.key",
]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.hatch.build.targets.wheel.force-include]
"config/models.yaml" = "agent/_data/models.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "context_index_performance: production-sized Context Index latency acceptance fixture",
  "allow_real_session_recall_db: explicitly opt out of temporary Session Recall storage",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# A deliberate correctness baseline, independent of new default/style rules.
select = ["E9", "F", "B006", "B008", "B012", "B018", "B023", "B032"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["agent"]
exclude = ["agent/cli/tui_app.py"]
