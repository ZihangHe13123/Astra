  glm-5.3-flash:
    provider: openai-compatible
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: ZHIPU_API_KEY
    catalog_provider: zhipu
    provider_label: Zhipu GLM API
    context_limit: 1000000
    capabilities: [tools, reasoning, thinking-required, vision, streaming]
    generation:
      temperature: 1.0
      # https://help.aliyun.com/zh/model-studio/glm-5-3-flash-by-zhipu
      max_tokens: 131072
      top_p: 0.95

  hy4-preview:
    provider: openai-compatible
    base_url: https://tokenhub.tencentmaas.com/v1
    base_url_env: HUNYUAN_BASE_URL
    api_key_env: HUNYUAN_API_KEY
    catalog_provider: hunyuan
    provider_label: Tencent Hunyuan API
    context_limit: 1048576
    capabilities: [tools, reasoning, streaming]
    generation:
      temperature: 0.9
      # HY4 Preview: 64K output; https://www.tencentcloud.com/document/product/1300/78934
      max_tokens: 65536
      top_p: 0.95

  # Google AI Studio — Gemini 4 family (native v1beta REST transport).
  # Unified 1M context window; synchronous output defaults to 64K tokens.
  # Sampling parameters (temperature/top_p/top_k) are deprecated on Gemini 4.
  # thinkingLevel xhigh exists only on Neon and Hydrogen; Carbon and Argon stop at high.
  gemini-4-neon:
    provider: google-gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    base_url_env: GEMINI_BASE_URL
    api_key_env: GEMINI_API_KEY
    catalog_provider: gemini
    provider_label: Google AI Studio · Gemini API
    context_limit: 1048576
    capabilities: [tools, reasoning, thinking-required, vision, streaming]
    reasoning_levels: [low, medium, high, xhigh]
    generation:
      max_tokens: 65536

  gemini-4-hydrogen:
    provider: google-gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    base_url_env: GEMINI_BASE_URL
    api_key_env: GEMINI_API_KEY
    catalog_provider: gemini
    provider_label: Google AI Studio · Gemini API
    context_limit: 1048576
    capabilities: [tools, reasoning, thinking-required, vision, streaming]
    reasoning_levels: [low, medium, high, xhigh]
    generation:
      max_tokens: 65536

  gemini-4-carbon:
    provider: google-gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    base_url_env: GEMINI_BASE_URL
    api_key_env: GEMINI_API_KEY
    catalog_provider: gemini
    provider_label: Google AI Studio · Gemini API
    context_limit: 1048576
    capabilities: [tools, reasoning, thinking-required, vision, streaming]
    reasoning_levels: [low, medium, high]
    generation:
      max_tokens: 32768

  gemini-4-argon:
    provider: google-gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    base_url_env: GEMINI_BASE_URL
    api_key_env: GEMINI_API_KEY
    catalog_provider: gemini
    provider_label: Google AI Studio · Gemini API
    context_limit: 1048576
    capabilities: [tools, reasoning, thinking-required, vision, streaming]
    reasoning_levels: [low, medium, high]
    generation:
      max_tokens: 32768

  # Anthropic Claude API (native Messages API, a Console API key billed per token).
  # 1M context; Astra compacts at 150k for cost. Thinking is adaptive (summaries shown as
  # reasoning); /mode sets output_config.effort. Sampling parameters are not sent.
  claude-opus-5-5:
    provider: anthropic-api
    base_url: https://api.anthropic.com/v1
    api_key_env: CLAUDE_API_KEY
    catalog_provider: claude-api
    provider_label: Claude API
    context_limit: 1000000
    capabilities: [tools, reasoning, vision, streaming]
    reasoning_levels: [low, medium, high, xhigh, max]
    generation:
      max_tokens: 64000

