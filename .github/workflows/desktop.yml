name: Desktop preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      ASTRA_GUI_DISABLE_APPSHOT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.27'
          python-version: '3.11.15'
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
      - name: Prepare optional desktop with the real launcher
        run: uv run --locked --extra dev python astra.py setup --gui --extra dev
      - name: Shared client and desktop tests
        run: |
          npm --prefix ui-core test
          npm --prefix ui-gui test
          uv run --no-sync python -m pytest -q tests/test_gui_protocol.py
      - name: Desktop doctor
        run: uv run --no-sync python astra.py doctor --json
      - name: Electron and Python loopback acceptance
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm --prefix ui-gui run test:e2e
