name: Maintenance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            gate_args: --wheel-smoke
          - os: macos-26
            gate_args: --wheel-smoke --context-index-performance --native
          - os: windows-2025
            gate_args: --wheel-smoke
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      ASTRA_RUN_CONTEXT_INDEX_PERF: "0"
      ASTRA_MACOS_COMPUTER_E2E: "0"
      ASTRA_MACOS_COMPUTER_HELPER_HARNESS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24 action runtime
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1; Node 24 action runtime
        with:
          version: "0.11.27"
          python-version: "3.11.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true
          download-from-astral-mirror: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0; Node 24 action runtime
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: |
            ui-tui/package-lock.json
            ui-core/package-lock.json
      - name: Install locked Python dependencies
        run: uv sync --locked --extra dev --extra mcp --extra tracing --extra server --extra notebook
      - name: Check installed Python dependencies
        run: uv pip check
      - name: Install and build shared UI protocol
        working-directory: ui-core
        run: npm ci && npm run build
      - name: Install locked TUI dependencies
        working-directory: ui-tui
        run: npm ci
      - name: Select macOS toolchain
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          swift --version
      # Phase T runs normal tests, wheel smoke, latency acceptance and Swift
      # tests in sequence. Performance never shares a runner with a Swift build.
      - name: Run release gate
        # Keep SQLite and browser profiles on the runner scratch volume,
        # outside the checkout, just like the launcher compatibility gate.
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: uv run --locked --no-sync python scripts/phase_t_gate.py --keep-going ${{ matrix.gate_args }}
