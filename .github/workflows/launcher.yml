name: Launcher compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - 'agent/launcher/**'
      - 'agent/runtime/paths.py'
      - 'agent/runtime/session_recall.py'
      - 'agent/runtime/context_index/embedding_worker.py'
      - 'agent/cli/environment.py'
      - 'agent/cli/backend.py'
      - 'agent/cli/session_lifecycle.py'
      - 'agent/runtime/self_protection.py'
      - 'agent/runtime/maintenance.py'
      - 'agent/runtime/event_writer.py'
      - 'agent/runtime/event_stream.py'
      - 'agent/runtime/session_wakeup.py'
      - 'agent/runtime/browser*.py'
      - 'agent/runtime/cdp_backend.py'
      - 'agent/runtime/extension_browser_backend.py'
      - 'agent/runtime/mcp.py'
      - 'agent/runtime/process_env.py'
      - 'agent/runtime/tools/browser.py'
      - 'agent/runtime/tools/comfyui.py'
      - 'tests/test_public_image_boundary.py'
      - 'agent/cli/browser_commands.py'
      - 'tests/test_browser*.py'
      - 'tests/test_cdp_backend.py'
      - 'tests/test_mcp*.py'
      - 'tests/test_self_protection.py'
      - 'tests/test_runtime_maintenance.py'
      - 'tests/test_backend_conversation_commands.py'
      - 'tests/test_event_writer.py'
      - 'tests/test_context_index_semantic.py'
      - 'tests/test_event_stream.py'
      - 'tests/test_backend_task_protocol.py'
      - 'tests/test_backend_terminal_shutdown.py'
      - 'tests/test_graceful_restart.py'
      - 'tests/test_session_lifecycle_protocol.py'
      - 'tests/test_session_wakeup*.py'
      - 'astra*'
      - 'tests/test_launcher*.py'
      - 'tests/test_embedding_runtime.py'
      - 'tests/test_posix_scripts.py'
      - 'tests/test_auxiliary_scripts.py'
      - 'tests/test_session_recall*.py'
      - 'scripts/astra-migrate.*'
      - 'scripts/checkmail.*'
      - 'scripts/activity-control.bat'
      - 'scripts/embedding-control.bat'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'agent/launcher/**'
      - 'agent/runtime/paths.py'
      - 'agent/runtime/session_recall.py'
      - 'agent/runtime/context_index/embedding_worker.py'
      - 'agent/cli/environment.py'
      - 'agent/cli/backend.py'
      - 'agent/cli/session_lifecycle.py'
      - 'agent/runtime/self_protection.py'
      - 'agent/runtime/maintenance.py'
      - 'agent/runtime/event_writer.py'
      - 'agent/runtime/event_stream.py'
      - 'agent/runtime/session_wakeup.py'
      - 'agent/runtime/browser*.py'
      - 'agent/runtime/cdp_backend.py'
      - 'agent/runtime/extension_browser_backend.py'
      - 'agent/runtime/mcp.py'
      - 'agent/runtime/process_env.py'
      - 'agent/runtime/tools/browser.py'
      - 'agent/runtime/tools/comfyui.py'
      - 'tests/test_public_image_boundary.py'
      - 'agent/cli/browser_commands.py'
      - 'tests/test_browser*.py'
      - 'tests/test_cdp_backend.py'
      - 'tests/test_mcp*.py'
      - 'tests/test_self_protection.py'
      - 'tests/test_runtime_maintenance.py'
      - 'tests/test_backend_conversation_commands.py'
      - 'tests/test_event_writer.py'
      - 'tests/test_context_index_semantic.py'
      - 'tests/test_event_stream.py'
      - 'tests/test_backend_task_protocol.py'
      - 'tests/test_backend_terminal_shutdown.py'
      - 'tests/test_graceful_restart.py'
      - 'tests/test_session_lifecycle_protocol.py'
      - 'tests/test_session_wakeup*.py'
      - 'astra*'
      - 'tests/test_launcher*.py'
      - 'tests/test_embedding_runtime.py'
      - 'tests/test_posix_scripts.py'
      - 'tests/test_auxiliary_scripts.py'
      - 'tests/test_session_recall*.py'
      - 'scripts/astra-migrate.*'
      - 'scripts/checkmail.*'
      - 'scripts/activity-control.bat'
      - 'scripts/embedding-control.bat'
      - '.github/workflows/launcher.yml'

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
        python-version: ['3.11.15']
        include:
          # Server.wait_closed also waits for peers starting with Python 3.12.
          - os: windows-2025
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.27'
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          download-from-astral-mirror: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
      - name: Install locked test dependencies
        run: uv sync --locked --extra dev --extra mcp --extra tracing --extra server --extra notebook
      - name: Exercise native launchers and update/recovery contracts
        # Keep database fixtures on the runner's scratch volume, outside the
        # checkout. Windows' user-profile temp volume can stall durable writes.
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >-
          uv run --locked --no-sync python -m pytest -q
          --basetemp="${{ runner.temp }}/astra-launcher-pytest"
          tests/test_launcher.py tests/test_launcher_windows_bootstrap.py
          tests/test_launcher_prerequisites.py tests/test_launcher_private_paths.py
          tests/test_launcher_posix_bootstrap.py
          tests/test_launcher_services.py tests/test_launcher_service_launchd.py
          tests/test_launcher_service_windows.py tests/test_launcher_service_embedding.py
          tests/test_embedding_runtime.py tests/test_posix_scripts.py tests/test_auxiliary_scripts.py
          tests/test_session_recall.py tests/test_session_recall_selftest.py tests/test_instance_lock.py
          tests/test_backend_handshake.py tests/test_cross_platform_examples.py tests/test_production_foundations.py
          tests/test_public_image_boundary.py
          tests/test_self_protection.py tests/test_graceful_restart.py tests/test_session_wakeup.py
          tests/test_runtime_maintenance.py
          tests/test_browser_upload.py tests/test_backend_conversation_commands.py
          tests/test_event_writer.py tests/test_event_stream.py tests/test_backend_terminal_shutdown.py
          tests/test_backend_task_protocol.py::test_backend_exposes_tasks_command_without_blocking_protocol
          tests/test_backend_task_protocol.py::test_protocol_fixture_drains_stderr_during_startup
          tests/test_backend_task_protocol.py::test_protocol_fixture_keeps_startup_failure_diagnostics
          tests/test_context_index_semantic.py
          tests/test_session_lifecycle_protocol.py tests/test_session_wakeup_protocol.py
          tests/test_browser_lifecycle.py tests/test_browser_child_environment.py tests/test_mcp_recovery.py
          tests/test_cdp_backend.py
          tests/test_browser_backend_router.py tests/test_browser_control_transport.py
          tests/test_extension_browser_backend.py tests/test_browser_auto_connect.py
